# Testes da app, a cada push e em cada Pull Request.
#
# Corre no Windows de propósito: é onde a app vive (Excel/COM, caminhos, cp1252)
# e um teste que passa no Linux e falha na máquina de quem usa a app não serve
# de nada. Nada aqui abre Excel nem toca em ficheiros de ninguém — a suite corre
# offline, com pastas temporárias (o teste do servidor DEV salta-se sozinho
# quando não há app de pé; ver tests/test_api.py).
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install --upgrade pip openpyxl

      - name: Compilar (o passo 1 da release)
        run: |
          python -m py_compile app.py
          python -m compileall -q cswaios

      - name: Suite
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t . -v
